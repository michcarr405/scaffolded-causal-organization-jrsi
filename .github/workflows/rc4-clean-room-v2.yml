name: RC4 clean-room reproducibility v2
on:
  push:
    branches: ["rc4-candidate"]
  workflow_dispatch:

jobs:
  clean-room-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
      - name: Install declared dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install numba==0.68.0
      - name: Record environment
        run: |
          python -V
          python -m pip freeze | sort | tee "${RUNNER_TEMP}/rc4_pip_freeze.txt"
      - name: Export frozen candidate tree
        run: |
          mkdir -p "${RUNNER_TEMP}/candidate"
          rsync -a             --exclude='.git/'             --exclude='.github/workflows/rc4-clean-room-v2.yml'             ./ "${RUNNER_TEMP}/candidate/"
      - name: Validate package and manifests
        working-directory: ${{ runner.temp }}/candidate
        run: |
          python scripts/validate_repository.py
          python scripts/validate_manifests.py
          python -m pytest -q
      - name: Validate recovered production bundles
        working-directory: ${{ runner.temp }}/candidate
        run: python scripts/validate_recovered_campaigns.py
      - name: Reproduce original catalytic prospective assay
        working-directory: ${{ runner.temp }}/candidate
        run: python scripts/run_catalytic_original_check.py
      - name: Upload RC4 logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rc4-clean-room-v2-logs
          path: |
            ${{ runner.temp }}/rc4_pip_freeze.txt
            ${{ runner.temp }}/candidate/work/
          if-no-files-found: ignore
