name: RC4.4 clean-room reproducibility
on:
  push:
    branches: ["rc4-candidate"]
  workflow_dispatch:

jobs:
  clean-room-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
      - name: Install declared dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Record environment
        run: |
          python -V
          python -m pip freeze | sort | tee "${RUNNER_TEMP}/rc4_pip_freeze.txt"
      - name: Export frozen candidate tree
        run: |
          mkdir -p "${RUNNER_TEMP}/candidate"
          rsync -a \
            --exclude='.git/' \
            --exclude='.github/workflows/rc4-clean-room-v2.yml' \
            ./ "${RUNNER_TEMP}/candidate/"
      - name: Validate package, manifests, and publication figures
        working-directory: ${{ runner.temp }}/candidate
        run: |
          python scripts/validate_repository.py
          python scripts/validate_manifests.py
          python scripts/validate_publication_figures.py
          python scripts/validate_figure_builders.py
          python -m pytest -q
      - name: Rebuild and validate publication figures
        working-directory: ${{ runner.temp }}/candidate
        run: python scripts/validate_figure_reproduction.py
      - name: Validate recovered production bundles
        working-directory: ${{ runner.temp }}/candidate
        run: python scripts/validate_recovered_campaigns.py
      - name: Reproduce original catalytic prospective assay
        working-directory: ${{ runner.temp }}/candidate
        shell: bash
        run: |
          set +e
          python scripts/run_catalytic_original_check.py
          strict_rc=$?
          set -e
          if [ "$strict_rc" -eq 0 ]; then
            echo "Strict byte-identical catalytic replay: PASS"
            exit 0
          fi
          echo "Strict catalytic byte comparison differed; applying pre-specified portable equivalence check."
          python - <<'PY'
          from pathlib import Path
          import hashlib, json, math
          import numpy as np
          import pandas as pd

          ROOT = Path.cwd()
          out = ROOT / "work" / "catalytic_original_check"
          ref = list((ROOT / "provenance/original_campaigns/canonical/catalytic/original_prospective").rglob("run_confirmatory.py"))[0].parent

          def sha256(p):
              return hashlib.sha256(Path(p).read_bytes()).hexdigest()

          for name in ["CONFIRM_ENDPOINT_STATES.npz", "CONFIRM_CATALYTIC_MATRIX.csv"]:
              ok = sha256(out / name) == sha256(ref / name)
              print(("PASS" if ok else "FAIL"), name, "(byte-exact)")
              if not ok:
                  raise SystemExit(1)

          out_stats = json.loads((out / "CONFIRM_STATS.json").read_text())
          if out_stats.get("all_primary_pass") is not True:
              print("FAIL CONFIRM_STATS.json (all_primary_pass is not true)")
              raise SystemExit(1)
          print("PASS CONFIRM_STATS.json (all_primary_pass=true)")

          def compare_frames(name, atol=1e-12, rtol=1e-12):
              a = pd.read_csv(out / name)
              b = pd.read_csv(ref / name)
              if list(a.columns) != list(b.columns) or a.shape != b.shape:
                  return False
              for c in a.columns:
                  aa, bb = a[c], b[c]
                  if pd.api.types.is_numeric_dtype(aa) and pd.api.types.is_numeric_dtype(bb):
                      av = aa.to_numpy(dtype=float)
                      bv = bb.to_numpy(dtype=float)
                      if not np.allclose(av, bv, atol=atol, rtol=rtol, equal_nan=True):
                          return False
                  else:
                      if not aa.fillna("<NA>").astype(str).equals(bb.fillna("<NA>").astype(str)):
                          return False
              return True

          for name in ["CONFIRM_BLOCK_RESULTS.csv", "CONFIRM_DIRECTION_RESULTS.csv", "CONFIRM_DIRECTION_SUMMARY.csv"]:
              ok = compare_frames(name)
              print(("PASS" if ok else "FAIL"), name, "(numeric-equivalent, rtol=atol=1e-12)")
              if not ok:
                  raise SystemExit(1)

          def json_equal(a, b, atol=1e-12, rtol=1e-12):
              if isinstance(a, bool) or isinstance(b, bool):
                  return a is b
              if isinstance(a, (int, float)) and isinstance(b, (int, float)):
                  if math.isnan(float(a)) and math.isnan(float(b)):
                      return True
                  return math.isclose(float(a), float(b), abs_tol=atol, rel_tol=rtol)
              if isinstance(a, dict) and isinstance(b, dict):
                  return set(a) == set(b) and all(json_equal(a[k], b[k], atol, rtol) for k in a)
              if isinstance(a, list) and isinstance(b, list):
                  return len(a) == len(b) and all(json_equal(x, y, atol, rtol) for x, y in zip(a, b))
              return a == b

          ref_stats = json.loads((ref / "CONFIRM_STATS.json").read_text())
          ok = json_equal(out_stats, ref_stats)
          print(("PASS" if ok else "FAIL"), "CONFIRM_STATS.json", "(numeric-equivalent, rtol=atol=1e-12)")
          if not ok:
              raise SystemExit(1)

          print("PORTABLE CATALYTIC CHECK: PASS")
          PY
      - name: Upload RC4.4 logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rc4-4-clean-room-logs
          path: |
            ${{ runner.temp }}/rc4_pip_freeze.txt
            ${{ runner.temp }}/candidate/work/
          if-no-files-found: ignore
