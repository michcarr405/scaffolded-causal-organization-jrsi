[project]
name = "scaffolded-causal-organization-reproducibility"
version = "0.1.7"
description = "RC4.4 release-candidate reproducibility artifact for scaffolded causal organization"
requires-python = ">=3.13"
dependencies = [
  "numpy==2.3.5",
  "numba==0.68.0",
  "pandas==2.2.3",
  "scipy==1.17.0",
  "matplotlib==3.10.8",
  "PyMuPDF==1.26.7",
  "Pillow==12.3.0",
  "pytest==9.0.2",
]
[tool.pytest.ini_options]
testpaths=["tests"]
